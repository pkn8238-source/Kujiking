<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>쿠지킹 모바일 확인</title>
<style>html,body{margin:0;background:#20262e;font-family:system-ui,sans-serif;color:#fff}
.wrap{display:flex;gap:24px;padding:20px;justify-content:center;align-items:flex-start}
.phone{width:390px;height:844px;border:10px solid #000;border-radius:36px;overflow:hidden;background:#fff}
.cap{font-size:13px;margin-bottom:6px;color:#9fb0c0}</style></head>
<body><div class="wrap">
<div><div class="cap" id="cap">390 × 844 (iPhone)</div><div class="phone"><iframe id="fr" width="390" height="844" style="border:0;display:block"></iframe></div></div>
</div>
<script>
var q = new URLSearchParams(location.search);
var t = q.get('t') || 'hold';
document.getElementById('cap').textContent = '390 × 844 (iPhone) · ' + (t === 'snap' ? '끝까지 뜯기' : '중간까지 뜯고 멈춤');
document.getElementById('fr').src = 'peel-drive.html?t=' + t + '&tp=touch';
</script>
</body></html>
