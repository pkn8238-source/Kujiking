<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>쿠지킹 모바일 미리보기</title>
<style>html,body{margin:0;height:100%;background:#1b1b1f}
body{display:grid;place-items:center}
iframe{width:390px;height:min(844px,96vh);border:0;border-radius:14px;background:#fffdf6;box-shadow:0 18px 50px rgba(0,0,0,.5)}</style>
</head><body>
<iframe id="phone" title="모바일 미리보기"></iframe>
<pre id="out" style="display:none"></pre>
<script>
var qs = location.search || '';
var fr = document.getElementById('phone');
fr.src = 'preview-v35.html' + qs + (qs ? '&' : '?') + 'frame=1';
setInterval(function () {
  try {
    var d = fr.contentDocument && fr.contentDocument.getElementById('devlog');
    if (d) { document.getElementById('out').textContent = d.textContent; document.title = 'M: ' + d.textContent.replace(/\n/g, ' | ').slice(0, 300); }
  } catch (e) {}
}, 400);
</script>
</body></html>
